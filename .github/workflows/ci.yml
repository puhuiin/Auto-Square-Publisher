name: CI 回归测试

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sent_cache.json'
      - 'campaign_intel.json'
      - 'README.md'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0（SHA 锁定防投毒，dependabot 负责跟进）
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0（同上锁定）
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法编译检查
        run: python -m py_compile main.py tests/test_core.py tests/test_metrics_report.py tests/test_workflows.py scripts/git_state_merge.py scripts/validate_workflows.py scripts/metrics_report.py

      - name: Workflow YAML 与内嵌 Bash 语法校验
        # workflow 文件变更会触发本 CI，但单测覆盖不到它们：YAML 手滑或 run 块少个 fi
        # 以前要等定时任务运行时才爆炸。在此提前拦截（pyyaml 仅校验用，不进 prod 依赖）。
        run: |
          pip install -q "pyyaml>=6,<7"
          python scripts/validate_workflows.py

      - name: 运行离线回归测试套件
        run: |
          python tests/test_core.py
          python tests/test_metrics_report.py
          python tests/test_workflows.py
