name: CI 回归测试

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sent_cache.json'
      - 'campaign_intel.json'
      - 'README.md'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周一 09:17 UTC（北京 17:17）跑一次含 LLM 实弹的全量检查：
    # 提前发现 Key 过期/额度耗尽/模型下线，而不是等发帖机器人连续熔断报警才知道。
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（SHA 锁定防投毒，dependabot 负责跟进）
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0（同上锁定）
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法编译检查
        run: |
          # 用通配而非逐个列举：R185 发现列举式清单漏了 tests/test_cost_analysis.py
          # 与 scripts/cost_analysis.py——新增文件永远不会自动进入校验
          python -m py_compile main.py tests/*.py scripts/*.py

      - name: Workflow YAML 与内嵌 Bash 语法校验
        # workflow 文件变更会触发本 CI，但单测覆盖不到它们：YAML 手滑或 run 块少个 fi
        # 以前要等定时任务运行时才爆炸。在此提前拦截（pyyaml 仅校验用，不进 prod 依赖）。
        run: |
          pip install -q "pyyaml>=6,<7"
          python scripts/validate_workflows.py

      - name: 运行离线回归测试套件
        # R185：改用 discover 而非逐个列举——R120 加入的 tests/test_cost_analysis.py
        # 有 12 个测试却从未被 CI 执行（cost_analysis 面板同期连爆两个口径 bug：
        # R120 stage 过滤、R167 dry 字段漂移）。列举式清单新增文件即静默漏跑。
        # 不接管道：`cmd | tail` 的退出码取自 tail，会让失败的测试静默变绿。
        run: python -m unittest discover -s tests -p "test_*.py"

  llm-live:
    # LLM 实弹冒烟：真实调一次生成链，验证 Key 有效性与模型可用性。
    # 仅 scheduled / 手动触发时执行（push/PR 不跑，避免每个 PR 都烧 token）。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（同上锁定）
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0（同上锁定）
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: LLM 实弹冒烟（全部提供商逐个实弹验证，失败即红）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          REASONIX_GW_OFF: "1" # CI 无本地网关，显式关闭探测
          # 本 job 只验证 LLM 通道，CI 不持有 SQUARE_API_KEY（发布密钥不进 CI）。
          # 不设此项时 healthcheck 的 SQUARE_API_KEY 检查必为 ✗ → 退出码 1 →
          # 下方 `set -e` 的命令替换被中断，输出丢失只剩 "exit code 1"（2026-09-14
          # 首次 schedule 运行即红，无任何诊断信息）。okx_draft 下该检查标记 ⊘。
          PUBLISH_PLATFORMS: okx_draft
        run: |
          # set -e 会在命令替换返回非零时立刻中断（连 echo 都跑不到），
          # 而 healthcheck 有故障时本就返回 1——必须显式吞掉退出码保住输出。
          OUT=$(python main.py --healthcheck --llm-live 2>&1) || true
          echo "$OUT"
          if ! echo "$OUT" | grep -q "LLM 实弹测试.*✔"; then
            echo "::error::LLM 实弹测试未通过——Key 过期/额度耗尽/模型下线，发帖机器人将在熔断中空转。请检查 Secrets。"
            exit 1
          fi
