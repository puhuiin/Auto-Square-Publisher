name: Binance Square Auto Poster Pro

on:
  schedule:
    # 采用错峰非整点触发 (每 20 分钟执行一次: 12分, 32分, 52分)，避开 GitHub 全球整点排队拥堵
    - cron: '12,32,52 * * * *'
  workflow_dispatch:
    # 支持在 GitHub 仓库界面手动一键触发与调试
    inputs:
      dry_run:
        description: '是否开启测试模式 (true 则仅模拟不真实发布)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_posts:
        description: '本次单次最大发帖条数'
        required: false
        default: '1'
        type: string
  repository_dispatch:
    # 支持外部免费 Cron (如 Cron-job.org / 宝塔 / 快捷指令) 发送 Webhook 0秒延迟远程唤醒
    types: [auto_post, trigger]

# 赋予工作流写入仓库代码的权限（用于 Git 回写 sent_cache.json）
permissions:
  contents: write

concurrency:
  group: binance-square-poster
  cancel-in-progress: false

jobs:
  run-poster:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查环境与密钥配置状态
        run: |
          echo "================ 运行环境与 Secrets 状态体检 ================"
          if [ -n "${{ secrets.SQUARE_API_KEY }}" ]; then echo "✔ SQUARE_API_KEY: 已检测到"; else echo "❌ SQUARE_API_KEY: 未检测到 (请在 Repository Secrets 中添加)"; fi
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then echo "✔ OPENROUTER_API_KEY: 已检测到"; fi
          if [ -n "${{ secrets.BAI_API_KEY }}" ]; then echo "✔ BAI_API_KEY: 已检测到"; fi
          if [ -n "${{ secrets.LLM_API_KEY }}" ]; then echo "✔ LLM_API_KEY: 已检测到"; fi
          if [ -n "${{ secrets.XKIRO_API_KEY }}" ]; then echo "✔ XKIRO_API_KEY: 已检测到"; fi
          if [ -n "${{ secrets.SERVERCHAN_KEY }}" ]; then echo "✔ SERVERCHAN_KEY (微信推送): 已检测到"; fi
          if [ -n "${{ secrets.PUSHPLUS_TOKEN }}" ]; then echo "✔ PUSHPLUS_TOKEN (微信推送): 已检测到"; fi
          if [ -n "${{ secrets.BARK_KEY }}" ]; then echo "✔ BARK_KEY (iOS推送): 已检测到"; fi
          echo "============================================================"

      - name: 执行自动化发帖脚本 (支持多模型故障转移)
        env:
          SQUARE_API_KEY: ${{ secrets.SQUARE_API_KEY }}
          
          # 主模型或自定义单一配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          
          # 高级多模型池配置 (JSON 数组格式)
          LLM_PROVIDERS_CONFIG: ${{ secrets.LLM_PROVIDERS_CONFIG }}
          
          # 常用免费/第三方模型提供商专用 Key 与 Model 映射 (可选)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || vars.OPENROUTER_MODEL || 'minimax/minimax-m3:free' }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          BAI_MODEL: ${{ secrets.BAI_MODEL || vars.BAI_MODEL || 'glm-5.3-flash' }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          INFERERA_API_KEY: ${{ secrets.INFERERA_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          
          # 可选通知与异常报警渠道 (微信 / iOS / Telegram / 团队群)
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          
          # 创作者活动与话题标签 (可选自定义)
          CAMPAIGN_TAGS: ${{ secrets.CAMPAIGN_TAGS || vars.CAMPAIGN_TAGS || '#Write2Earn #BinanceSquare #热点解析' }}
          
          # 运行参数
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts || vars.MAX_POSTS_PER_RUN || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'false' }}
        run: |
          python main.py

      - name: 回写状态并提交 Git 变更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain sent_cache.json campaign_intel.json)" ]; then
            echo "检测到数据或活动情报已更新，准备提交并推送..."
            git add sent_cache.json campaign_intel.json
            git commit -m "chore(cache): update sent_cache.json & campaign_intel.json [skip ci]" || true
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || echo "⚠️ 提示: git push 未成功，请确认仓库 Settings -> Actions -> General 中是否开启了 'Read and write permissions' 权限"
          else
            echo "状态数据无任何变动，无需提交。"
          fi
