name: Binance Square Auto Poster Pro

on:
  schedule:
    # 定时自动触发 (每 20 分钟执行一次)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # 支持在 GitHub 仓库界面手动一键触发与调试
    inputs:
      dry_run:
        description: '是否开启测试模式 (true 则仅模拟不真实发布)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_posts:
        description: '本次单次最大发帖条数'
        required: false
        default: '1'
        type: string
  repository_dispatch:
    # 支持外部免费 Cron 发送 Webhook 0秒延迟远程唤醒
    types: [auto_post, trigger]

# 赋予工作流写入仓库代码的权限（用于 Git 回写 sent_cache.json）
permissions:
  contents: write

concurrency:
  group: binance-square-poster
  cancel-in-progress: false

jobs:
  run-poster:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查环境与密钥配置状态
        env:
          SQUARE_KEY: ${{ secrets.SQUARE_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BAI_KEY: ${{ secrets.BAI_API_KEY }}
          LLM_KEY: ${{ secrets.LLM_API_KEY }}
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PP_KEY: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          echo "================ 运行环境与 Secrets 状态体检 ================"
          if [ -n "$SQUARE_KEY" ]; then echo "✔ SQUARE_API_KEY: 已检测到"; else echo "❌ SQUARE_API_KEY: 未检测到 (请在 Repository Secrets 中配置)"; fi
          if [ -n "$OPENROUTER_KEY" ]; then echo "✔ OPENROUTER_API_KEY: 已检测到"; fi
          if [ -n "$BAI_KEY" ]; then echo "✔ BAI_API_KEY: 已检测到"; fi
          if [ -n "$LLM_KEY" ]; then echo "✔ LLM_API_KEY: 已检测到"; fi
          if [ -n "$SC_KEY" ]; then echo "✔ SERVERCHAN_KEY (微信推送): 已检测到"; fi
          if [ -n "$PP_KEY" ]; then echo "✔ PUSHPLUS_TOKEN (微信推送): 已检测到"; fi
          if [ -n "$BARK_KEY" ]; then echo "✔ BARK_KEY (iOS推送): 已检测到"; fi
          echo "============================================================"

      - name: 执行自动化发帖脚本 (支持多模型故障转移)
        env:
          SQUARE_API_KEY: ${{ secrets.SQUARE_API_KEY }}
          
          # 主模型或自定义单一配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          
          # 高级多模型池配置 (JSON 数组格式)
          LLM_PROVIDERS_CONFIG: ${{ secrets.LLM_PROVIDERS_CONFIG }}
          
          # 常用免费/第三方模型提供商专用 Key 与 Model 映射
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          BAI_MODEL: ${{ secrets.BAI_MODEL }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          INFERERA_API_KEY: ${{ secrets.INFERERA_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          
          # 可选通知与异常报警渠道 (微信 / iOS / Telegram / 团队群)
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          
          # 创作者活动与话题标签 (可选自定义)
          CAMPAIGN_TAGS: ${{ secrets.CAMPAIGN_TAGS }}
          
          # 运行参数
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python main.py

      - name: 回写状态并提交 Git 变更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          for i in 1 2 3; do
            if [ -z "$(git status --porcelain sent_cache.json campaign_intel.json)" ]; then
              echo "状态数据无任何变动，无需提交。"
              break
            fi

            echo "检测到数据或活动情报已更新，准备提交并推送 (尝试第 $i 次)..."
            git add sent_cache.json campaign_intel.json
            git commit -m "chore(cache): update sent_cache.json & campaign_intel.json [skip ci]" || true

            if git pull --rebase origin ${{ github.ref_name }}; then
              if git push origin HEAD:${{ github.ref_name }}; then
                echo "✔ 状态持久化并成功推送到 GitHub 远程仓库！"
                break
              fi
            fi

            echo "⚠️ 检测到远程并发更新或 rebase 冲突，正在回滚并合并远程最新缓存..."
            git rebase --abort || true
            git fetch origin ${{ github.ref_name }}
            python -c "
import json, os
for f in ['sent_cache.json', 'campaign_intel.json']:
    if not os.path.exists(f): continue
    try:
        remote_data_raw = os.popen(f'git show origin/${{ github.ref_name }}:{f}').read()
        if not remote_data_raw: continue
        r_data = json.loads(remote_data_raw)
        with open(f, 'r', encoding='utf-8') as local_f:
            l_data = json.load(local_f)
        if isinstance(l_data, list) and isinstance(r_data, list):
            seen_ids = set()
            merged = []
            for item in r_data + l_data:
                if isinstance(item, dict) and item.get('id'):
                    if item['id'] not in seen_ids:
                        seen_ids.add(item['id'])
                        merged.append(item)
            with open(f, 'w', encoding='utf-8') as out_f:
                json.dump(merged, out_f, ensure_ascii=False, indent=2)
    except Exception as e:
        print('Merge error:', e)
"
            git add sent_cache.json campaign_intel.json
            git commit --amend -m "chore(cache): update sent_cache.json & campaign_intel.json [skip ci]" || true
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✔ 智能合并冲突后推送成功！"
              break
            fi
            sleep 2
          done
