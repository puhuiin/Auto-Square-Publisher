name: Binance Square Auto Poster Pro

on:
  schedule:
    # 定时自动触发 (每 20 分钟执行一次)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # 支持在 GitHub 仓库界面手动一键触发与调试
    inputs:
      dry_run:
        description: '是否开启测试模式 (true 则仅模拟不真实发布)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_posts:
        description: '本次单次最大发帖条数'
        required: false
        default: '1'
        type: string
  repository_dispatch:
    # 支持外部免费 Cron 发送 Webhook 0秒延迟远程唤醒
    types: [auto_post, trigger]

# 赋予工作流写入仓库代码的权限（用于 Git 回写 sent_cache.json）
permissions:
  contents: write

concurrency:
  group: binance-square-poster
  cancel-in-progress: false

jobs:
  run-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 硬性超时保护，防止网络挂起导致镜像浪费

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆加速检出，回写步骤自带 fetch 对齐远端，无需完整历史
          persist-credentials: true

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查环境与密钥配置状态
        env:
          SQUARE_KEY: ${{ secrets.SQUARE_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BAI_KEY: ${{ secrets.BAI_API_KEY }}
          LLM_KEY: ${{ secrets.LLM_API_KEY }}
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PP_KEY: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          echo "================ 运行环境与 Secrets 状态体检 ================"
          if [ -n "$SQUARE_KEY" ]; then echo "✔ SQUARE_API_KEY: 已检测到"; else echo "❌ SQUARE_API_KEY: 未检测到 (请在 Repository Secrets 中配置)"; fi
          if [ -n "$OPENROUTER_KEY" ]; then echo "✔ OPENROUTER_API_KEY: 已检测到"; fi
          if [ -n "$BAI_KEY" ]; then echo "✔ BAI_API_KEY: 已检测到"; fi
          if [ -n "$LLM_KEY" ]; then echo "✔ LLM_API_KEY: 已检测到"; fi
          if [ -n "$SC_KEY" ]; then echo "✔ SERVERCHAN_KEY (微信推送): 已检测到"; fi
          if [ -n "$PP_KEY" ]; then echo "✔ PUSHPLUS_TOKEN (微信推送): 已检测到"; fi
          if [ -n "$BARK_KEY" ]; then echo "✔ BARK_KEY (iOS推送): 已检测到"; fi
          echo "============================================================"

      - name: 执行自动化发帖脚本 (支持多模型故障转移)
        env:
          SQUARE_API_KEY: ${{ secrets.SQUARE_API_KEY }}
          
          # 主模型或自定义单一配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          
          # 高级多模型池配置 (JSON 数组格式)
          LLM_PROVIDERS_CONFIG: ${{ secrets.LLM_PROVIDERS_CONFIG }}
          
          # 常用免费/第三方模型提供商专用 Key 与 Model 映射
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          BAI_MODEL: ${{ secrets.BAI_MODEL }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          INFERERA_API_KEY: ${{ secrets.INFERERA_API_KEY }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          
          # 可选通知与异常报警渠道 (微信 / iOS / Telegram / 团队群)
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          
          # 创作者活动与话题标签 (可选自定义)
          CAMPAIGN_TAGS: ${{ secrets.CAMPAIGN_TAGS }}

          # 运营调优参数 (可在 Repo Settings -> Variables 中配置，不配则用默认值)
          #   MAX_NEWS_AGE_HOURS:      新闻最大时效小时数 (默认 48)
          #   DUP_SIMILARITY_THRESHOLD: 跨源近似标题去重阈值 0~1 (默认 0.65)
          #   MIN_IMPACT_SCORE:        最低热度分门槛 (默认 0 = 不过滤)
          #   MAX_DAILY_POSTS:         24h 发帖配额上限，防刷屏保权重 (默认 12, 0 = 不限)
          #   ACTIVE_HOURS_BEIJING:    北京时间活跃窗口，如 8-23；留空 = 全天
          MAX_NEWS_AGE_HOURS: ${{ vars.MAX_NEWS_AGE_HOURS }}
          DUP_SIMILARITY_THRESHOLD: ${{ vars.DUP_SIMILARITY_THRESHOLD }}
          MIN_IMPACT_SCORE: ${{ vars.MIN_IMPACT_SCORE }}
          MAX_DAILY_POSTS: ${{ vars.MAX_DAILY_POSTS }}
          ACTIVE_HOURS_BEIJING: ${{ vars.ACTIVE_HOURS_BEIJING }}

          # 运行参数
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python main.py

      - name: 回写状态并提交 Git 变更 (快照并集合并 - 零冲突)
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"

          if [ -z "$(git status --porcelain sent_cache.json campaign_intel.json)" ]; then
            echo "状态数据无任何变动，无需提交。"
            exit 0
          fi

          echo "检测到状态变更，进入 [快照 -> 同步远端 -> 并集合并 -> 重试推送] 安全流程..."
          # 1. 把本次运行产生的本地状态先存到沙箱外，防止被远端覆盖
          cp sent_cache.json /tmp/local_sent_cache.json 2>/dev/null || true
          cp campaign_intel.json /tmp/local_intel.json 2>/dev/null || true

          for i in 1 2 3 4; do
            # 2. 每次重试都先对齐到远端最新，本地状态始终从 /tmp 快照并回去，永远不会产生 Git 冲突
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            python - <<'PYEOF'
          import json

          def load_list(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  if isinstance(data, list):
                      return data
                  if isinstance(data, dict):
                      return data.get("sent_ids", [])
              except Exception:
                  pass
              return []

          # sent_cache.json: 本地与远端按 id 取并集，任何一方已发记录都不丢失，杜绝重复发帖
          union = {}
          for item in load_list("sent_cache.json") + load_list("/tmp/local_sent_cache.json"):
              if isinstance(item, dict) and item.get("id"):
                  union[item["id"]] = item
          merged = sorted(union.values(), key=lambda x: x.get("sent_at", ""))[-500:]
          with open("sent_cache.json", "w", encoding="utf-8") as f:
              json.dump(merged, f, ensure_ascii=False, indent=2)

          # campaign_intel.json: 保留 last_updated 较新的一份
          def load_obj(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      d = json.load(f)
                  return d if isinstance(d, dict) else None
              except Exception:
                  return None

          versions = [d for d in (load_obj("campaign_intel.json"), load_obj("/tmp/local_intel.json")) if d]
          if versions:
              best = max(versions, key=lambda d: d.get("last_updated", ""))
              with open("campaign_intel.json", "w", encoding="utf-8") as f:
                  json.dump(best, f, ensure_ascii=False, indent=2)
          PYEOF

            # 3. 若并集后与远端完全一致则无需提交（例如并发任务已先一步回写）
            if git diff --quiet -- sent_cache.json campaign_intel.json; then
              echo "远端已包含全部最新状态，无需重复提交。"
              exit 0
            fi

            git add sent_cache.json campaign_intel.json
            git commit -m "chore(cache): update sent_cache.json & campaign_intel.json [skip ci]"

            if git push origin "HEAD:$BRANCH"; then
              echo "✔ 状态持久化成功推送到远程仓库！(第 $i 次尝试)"
              exit 0
            fi
            echo "⚠️ 推送被拒绝（远端出现新提交），重新拉取合并后重试 ($i/4)..."
            sleep $((i * 2))
          done

          echo "❌ 多次重试后仍推送失败，本次缓存仅保留在运行沙箱中，下次运行会自动兜底。"
          exit 1
