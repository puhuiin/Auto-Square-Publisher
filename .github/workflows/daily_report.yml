name: Daily Report

# R723：每日状态报告推送到钉钉。
# ★ 与 auto_post.yml 的关系：那边是"**有事才通知**"（Notifier，错误还有 12h 冷却），
#   这边是"**每天固定一份快照**"——哪怕一切正常也要报。语义不同，故独立 workflow。
# ⚠️ 时刻选 8:23（北京时间）：错开整点（GitHub 高负载时段 cron 易被丢弃，
#   同 auto_post 的 7/27/47 错峰理由）；且此时前一天的完整数据都已落盘。
on:
  schedule:
    - cron: '23 8 * * *'   # UTC ⇒ 北京时间 16:23
  workflow_dispatch:

permissions:
  contents: write   # 只需读 metrics.jsonl + token_engagement.json

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ★ R798：本文件是 R723 新建的，此前两个 action 写成 @v4/@v5 浮标
      #   ——仓库其它工作流全部 SHA 锁定且 tests/test_workflows.py 有强制
      #   契约测试，但当时该测试的文件白名单没含本文件 ⇒ 唯一一条漏网的
      #   浮标引用静默存活（浮标可被上游改指向 ⇒ 供应链投毒面）。现补齐
      #   锁定并把本文件纳入白名单，让契约测试此后覆盖它。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（SHA 锁定防投毒，dependabot 负责跟进）

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0（同上锁定）
        with:
          python-version: '3.12'

      # ⚠️ metrics.jsonl 由发帖机器人持续追加，**必须取最新**：
      #   checkout 拿到的是上一次提交里的快照 ⇒ 直接跑会少掉最近若干轮。
      - name: 取最新遥测
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:metrics.jsonl > metrics.jsonl || \
            echo "⚠️ metrics.jsonl 不存在（首次运行？）" > metrics.jsonl
          wc -l metrics.jsonl

      - name: 生成并发送每日报告
        env:
          # ★ 不写仓库、不写明文：token 走 secret（R619 教训）
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          # ★★ R798：R781 在 daily_report.py 里设计了「主通道失败 → 试
          #   WEBHOOK_URL 兜底」的链，但本步骤只导出了 DINGTALK_WEBHOOK_URL
          #   ⇒ `if fallback` 恒假 ⇒ **兜底通道在生产上是死代码**，且收尾那句
          #   「主通道与兜底通道均失败」是它从未验证过的结论（10-18 生产日志
          #   实证：只打了一次发送、只出现一行 errcode 300005 就走完）。
          #   透传后兜底才真的存在（两个 secret 若指向同一 URL，
          #   daily_report.py 会识别并如实说明"无法独立兜底"）。
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK_URL" ]; then
            echo "::warning::未配置 DINGTALK_WEBHOOK_URL，跳过发送（报告已打印在日志）"
            python scripts/daily_report.py --dry-run
            exit 0
          fi
          python scripts/daily_report.py --hours 24

      - name: 结果写回 Step Summary
        if: always()
        run: python scripts/daily_report.py --dry-run >> "$GITHUB_STEP_SUMMARY" || true
